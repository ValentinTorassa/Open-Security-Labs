version: 2
updates:
  # El sitio (Astro). Las alertas y los fixes de seguridad no esperan; las
  # actualizaciones de versión esperan una semana, para que una release
  # comprometida tenga tiempo de ser retirada.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]

  # El entorno del lab de phishing: requirements.txt fijado con ==, que el
  # Containerfile instala tal cual.
  - package-ecosystem: pip
    directory: /entornos/ciberseguridad/medir-simulacion-phishing/phantomlog
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      phantomlog-pip:
        patterns: ["*"]
        update-types: [minor, patch]

  # Las acciones están fijadas por SHA con la versión en un comentario;
  # Dependabot mueve los dos juntos.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
