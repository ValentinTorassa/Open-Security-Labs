name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint · check · build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit

      # Las comprobaciones que los labs mandan a correr ("Probalo en local")
      # tienen que seguir dando lo que el texto promete.
      - name: Lab checks
        run: npm run lab:check

      - name: Prettier
        run: npx prettier --check .

      - name: Astro check
        run: npx astro check

      - name: Build
        run: npm run build

      # El HTML generado tiene que ser reproducible: dos builds del mismo
      # commit deben ser byte-idénticos (protege contra uids aleatorios y
      # órdenes de colección no determinísticos).
      - name: Determinism check (build twice, diff)
        run: |
          cp -r dist /tmp/dist-first
          npm run build
          diff -r /tmp/dist-first dist

  secrets:
    name: secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
